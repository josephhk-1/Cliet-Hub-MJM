<!DOCTYPE html>
<html lang="en" dir="ltr" id="root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rattan Palace — Professional Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Tajawal:wght@400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e0a;
    --sidebar: #0a0804;
    --surface: #1a1610;
    --surface2: #241e14;
    --border: #3a2e1a;
    --gold: #c9960c;
    --gold-light: #f0c040;
    --gold-faint: rgba(201,150,12,0.10);
    --gold-border: rgba(201,150,12,0.25);
    --text: #f0e6d2;
    --text2: #9a8a72;
    --text3: #5a5040;
    --green: #4d9e6a;
    --green-bg: rgba(77,158,106,0.12);
    --red: #c45252;
    --red-bg: rgba(196,82,82,0.12);
    --blue: #4a7ab5;
    --blue-bg: rgba(74,122,181,0.12);
    --orange: #c47a2c;
    --orange-bg: rgba(196,122,44,0.12);
    --purple: #8b5cf6;
    --purple-bg: rgba(139,92,246,0.12);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }
  [dir="rtl"] body, [dir="rtl"] * { font-family: 'Tajawal', sans-serif; }
  h1, h2, h3 { font-family: 'Cormorant Garamond', serif; font-weight: 600; letter-spacing: 0.02em; }
  [dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3 { font-family: 'Amiri', serif; }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

  #app { display: flex; height: 100vh; }
  #sidebar {
    width: 240px; min-width: 240px; background: var(--sidebar); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 30;
  }
  #main-content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  #view-area { flex: 1; overflow-y: auto; }

  .sidebar-logo { padding: 28px 20px 20px; border-bottom: 1px solid var(--border); text-align: center; }
  .logo-rp { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 700; color: var(--gold); line-height:1; }
  .logo-sub { font-size: 10px; color: var(--text2); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 4px; }
  .nav-section { padding: 16px 12px; }
  .nav-label { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.15em; padding: 0 8px; margin-bottom: 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;
    cursor: pointer; color: var(--text2); font-size: 14px; font-weight: 500;
    transition: all 0.15s ease; user-select: none; margin-bottom: 2px;
    border: 1px solid transparent;
  }
  .nav-item:hover { background: var(--surface); color: var(--text); }
  .nav-item.active { background: var(--gold-faint); color: var(--gold); border-color: var(--gold-border); }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
  .sidebar-bottom { margin-top: auto; padding: 16px 12px; border-top: 1px solid var(--border); }
  .lang-toggle { display: flex; gap: 4px; }
  .lang-btn { flex:1; padding: 6px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text2); transition: all 0.15s; }
  .lang-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }
  .hub-id-badge { font-size: 11px; color: var(--text3); padding: 6px 8px; background: var(--surface); border-radius: 6px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }

  #topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .topbar-title { font-size: 20px; color: var(--text); }
  .topbar-actions { display: flex; gap: 8px; }

  #auth-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 100%; max-width: 440px; }
  .auth-logo { text-align: center; margin-bottom: 32px; }
  .auth-logo .logo-rp { font-size: 36px; display: block; }
  .auth-logo .logo-sub { display: block; font-size: 11px; }
  .auth-tabs { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 10px; margin-bottom: 24px; }
  .auth-tab { flex:1; padding: 8px; border-radius: 7px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; background: transparent; color: var(--text2); transition: all 0.15s; }
  .auth-tab.active { background: var(--gold); color: #000; }

  .field-label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; letter-spacing: 0.05em; }
  .field-input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 10px 14px; font-size: 14px; outline: none; transition: border-color 0.15s;
    font-family: inherit;
  }
  .field-input:focus { border-color: var(--gold); }
  .field-input::placeholder { color: var(--text3); }
  select.field-input option { background: var(--surface); }
  textarea.field-input { resize: vertical; min-height: 80px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: all 0.15s ease; white-space: nowrap; font-family: inherit; }
  .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; }
  .btn-xs { padding: 4px 8px; font-size: 11px; border-radius: 5px; }
  .btn-gold { background: var(--gold); color: #000; border-color: var(--gold); }
  .btn-gold:hover { background: var(--gold-light); border-color: var(--gold-light); }
  .btn-ghost { background: transparent; color: var(--text2); border-color: var(--border); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-red { background: var(--red-bg); color: var(--red); border-color: var(--red); }
  .btn-red:hover { background: var(--red); color: white; }
  .btn-green { background: var(--green-bg); color: var(--green); border-color: var(--green); }
  .btn-blue { background: var(--blue-bg); color: var(--blue); border-color: var(--blue); }
  .btn-purple { background: var(--purple-bg); color: var(--purple); border-color: var(--purple); }
  .btn-ai { background: linear-gradient(135deg, #6a3de8, #c9960c); color: white; border-color: transparent; }
  .btn-ai:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; pointer-events: none; }

  .btn-loading { position: relative; color: transparent !important; pointer-events: none; }
  .btn-loading::after {
    content: ''; position: absolute; inset: 0; margin: auto;
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid currentColor; border-color: white transparent white transparent;
    animation: spin 0.7s linear infinite; color: white;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .card-sm { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; }

  .kpi-card { padding: 20px; position: relative; overflow: hidden; }
  .kpi-card::before { content: ''; position: absolute; top: -20px; right: -20px; width: 80px; height: 80px; border-radius: 50%; opacity: 0.08; }
  .kpi-gold::before { background: var(--gold); }
  .kpi-green::before { background: var(--green); }
  .kpi-blue::before { background: var(--blue); }
  .kpi-red::before { background: var(--red); }
  .kpi-purple::before { background: var(--purple); }
  .kpi-value { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 700; line-height: 1; }
  .kpi-label { font-size: 12px; color: var(--text2); margin-top: 4px; }

  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-red { background: var(--red-bg); color: var(--red); }
  .badge-blue { background: var(--blue-bg); color: var(--blue); }
  .badge-orange { background: var(--orange-bg); color: var(--orange); }
  .badge-gold { background: var(--gold-faint); color: var(--gold); }
  .badge-purple { background: var(--purple-bg); color: var(--purple); }
  .badge-gray { background: rgba(90,80,64,0.3); color: var(--text2); }

  .tab-bar { display: flex; gap: 2px; padding: 4px; background: var(--bg); border-radius: 10px; }
  .tab-btn { padding: 8px 16px; border-radius: 7px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; background: transparent; color: var(--text2); transition: all 0.15s; font-family: inherit; }
  .tab-btn.active { background: var(--surface); color: var(--gold); }

  .list-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.1s; }
  .list-item:last-child { border-bottom: none; }
  .list-item:hover { background: var(--surface2); }
  .list-item.selected { background: var(--gold-faint); border-right: 2px solid var(--gold); }
  [dir="rtl"] .list-item.selected { border-right: none; border-left: 2px solid var(--gold); }

  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--gold); flex-shrink: 0; font-family: 'Cormorant Garamond', serif; }
  .avatar-lg { width: 52px; height: 52px; font-size: 18px; }

  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .data-table th { background: var(--surface2); color: var(--text2); font-weight: 600; padding: 10px 14px; text-align: left; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; border-bottom: 1px solid var(--border); }
  [dir="rtl"] .data-table th { text-align: right; }
  .data-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr:hover td { background: var(--surface2); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
  .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 64px rgba(0,0,0,0.6); }
  .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-body { padding: 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

  .progress-bar { background: var(--bg); border-radius: 99px; overflow: hidden; height: 6px; }
  .progress-fill { height: 100%; border-radius: 99px; background: var(--gold); transition: width 0.3s ease; }

  #toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 500; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 20px; font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); animation: toastIn 0.3s ease; white-space: nowrap; }
  .toast-success { border-left: 3px solid var(--green); }
  .toast-error { border-left: 3px solid var(--red); }
  .toast-info { border-left: 3px solid var(--blue); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .ai-panel { background: linear-gradient(135deg, rgba(106,61,232,0.1), rgba(201,150,12,0.08)); border: 1px solid rgba(106,61,232,0.25); border-radius: 10px; padding: 14px; }

  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px; text-align: center; gap: 12px; }
  .empty-icon { font-size: 40px; opacity: 0.3; }
  .empty-title { font-size: 16px; font-weight: 600; color: var(--text2); }
  .empty-desc { font-size: 13px; color: var(--text3); max-width: 280px; }

  .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

  .finance-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .summary-card { padding: 16px; border-radius: 10px; text-align: center; }
  .summary-value { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 700; }
  .summary-label { font-size: 11px; margin-top: 2px; }

  @media (max-width: 768px) {
    #sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
    [dir="rtl"] #sidebar { left: auto; right: 0; transform: translateX(100%); }
    #sidebar.open { transform: translateX(0); }
    .finance-summary { grid-template-columns: 1fr; }
  }

  .text-gold { color: var(--gold); }
  .text-muted { color: var(--text2); }
  .text-faint { color: var(--text3); }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  
  /* Quote items styling */
  .quote-item-row { display: grid; grid-template-columns: 80px 1fr 100px 120px 140px 50px; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .quote-item-row input, .quote-item-row textarea { font-size: 13px; }
  .quote-item-row textarea { min-height: 60px; }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-rp">✦ RATTAN PALACE</span>
      <span class="logo-sub" style="color:var(--text2);margin-top:4px;">Professional Management Hub</span>
      <div style="margin-top:12px; display:flex; gap:4px; justify-content:center;">
        <button class="lang-btn active" id="auth-lang-en" onclick="setAuthLang('en')">EN</button>
        <button class="lang-btn" id="auth-lang-ar" onclick="setAuthLang('ar')">AR</button>
      </div>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-new" onclick="switchAuthTab('new')" data-t="createNewHub">Create New Hub</button>
      <button class="auth-tab" id="tab-existing" onclick="switchAuthTab('existing')" data-t="joinExistingHub">Join Existing Hub</button>
    </div>
    <div id="auth-form-new">
      <div style="margin-bottom:14px;">
        <label class="field-label" data-t="hubIdLabel">Hub ID</label>
        <input id="new-hub-id" class="field-input" readonly style="opacity:0.6;">
      </div>
      <div style="margin-bottom:14px;">
        <label class="field-label" data-t="passwordLabel">Password</label>
        <input id="new-hub-pwd" class="field-input" type="password" data-t-placeholder="passwordPlaceholder">
      </div>
      <div style="margin-bottom:20px;">
        <label class="field-label" data-t="confirmPasswordLabel">Confirm Password</label>
        <input id="new-hub-pwd2" class="field-input" type="password" data-t-placeholder="confirmPasswordPlaceholder">
      </div>
      <button class="btn btn-gold" style="width:100%;" id="create-hub-btn" onclick="handleCreateHub()" data-t="createHubBtn">Create Hub</button>
    </div>
    <div id="auth-form-existing" style="display:none;">
      <div style="margin-bottom:14px;">
        <label class="field-label" data-t="hubIdLabel">Hub ID</label>
        <input id="existing-hub-id" class="field-input" data-t-placeholder="hubIdPlaceholder">
      </div>
      <div style="margin-bottom:20px;">
        <label class="field-label" data-t="passwordLabel">Password</label>
        <input id="existing-hub-pwd" class="field-input" type="password" data-t-placeholder="passwordPlaceholder">
      </div>
      <button class="btn btn-gold" style="width:100%;" id="login-hub-btn" onclick="handleLoginHub()" data-t="loginBtn">Login</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none;">
  <nav id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-rp">✦ RATTAN PALACE</div>
      <div class="logo-sub">Hub Pro</div>
    </div>
    <div class="nav-section">
      <div class="nav-label" data-t="navigation">Navigation</div>
      <div class="nav-item active" data-module="dashboard" onclick="navigate('dashboard')">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span data-t="dashboard">Dashboard</span>
      </div>
      <div class="nav-item" data-module="clients" onclick="navigate('clients')">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        <span data-t="clients">Clients</span>
      </div>
      <div class="nav-item" data-module="quotes" onclick="navigate('quotes')">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span data-t="quotes">Quotes</span>
      </div>
      <div class="nav-item" data-module="projects" onclick="navigate('projects')">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <span data-t="projects">Projects</span>
      </div>
      <div class="nav-item" data-module="finance" onclick="navigate('finance')">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span data-t="finance">Finance</span>
      </div>
    </div>
    <div class="sidebar-bottom">
      <div class="hub-id-badge">
        <span id="sidebar-hub-id">HUB: ···</span>
        <button onclick="copyHubId()" title="Copy" style="background:none;border:none;cursor:pointer;color:var(--text3);padding:2px;">
          <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        </button>
      </div>
      <div class="lang-toggle" style="margin-bottom:8px;">
        <button class="lang-btn active" id="lang-en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" id="lang-ar" onclick="setLang('ar')">AR</button>
      </div>
      <button class="nav-item" style="width:100%;justify-content:flex-start;" onclick="navigate('settings')">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
        <span data-t="settings">Settings</span>
      </button>
      <button class="nav-item" style="width:100%;justify-content:flex-start;margin-top:2px;" onclick="handleLogout()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        <span data-t="logout">Logout</span>
      </button>
    </div>
  </nav>

  <div id="main-content">

const t = (key, vars={}) => {
  let str = T[APP.lang][key] || key;
  Object.keys(vars).forEach(k => str = str.replace(\`{{\${k}}}\`, vars[k]));
  return str;
};

const $ = id => document.getElementById(id);
const $$ = sel => document.querySelectorAll(sel);

function el(tag, cls='', text='') {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

function formatMoney(n) {
  if (isNaN(n) || n === undefined) return '0';
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function formatDate(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleDateString(APP.lang === 'ar' ? 'ar-SA' : 'en-US'); } catch { return d; }
}

function getInitials(name='') {
  const words = name.trim().split(/\s+/);
  if (words.length >= 2) return (words[0][0] + words[words.length-1][0]).toUpperCase();
  return name.substring(0,2).toUpperCase() || '?';
}

async function hashPwd(pwd) {
  const enc = new TextEncoder().encode(pwd);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function genHubId() {
  return crypto.randomUUID().replace(/-/g,'').substring(0,8).toUpperCase();
}

function showToast(msg, type='success') {
  const c = $('toast-container');
  const toast = el('div', \`toast toast-\${type}\`);
  const icon = type==='success'?'✓':type==='error'?'✕':'ℹ';
  const iconEl = el('span', '', icon);
  iconEl.style.cssText = \`font-weight:700;color:\${type==='success'?'var(--green)':type==='error'?'var(--red)':'var(--blue)'}\`;
  toast.appendChild(iconEl);
  toast.appendChild(el('span','',msg));
  c.appendChild(toast);
  setTimeout(() => { if(c.contains(toast)) c.removeChild(toast); }, 3500);
}

function closeModal(id) { const m = $(id); if (m) m.style.display = 'none'; }
function openModal(id) { const m = $(id); if (m) m.style.display = 'flex'; }

function confirmAction(title, text, cb) {
  $('confirm-title').textContent = title;
  $('confirm-text').textContent = text;
  APP.confirmCb = cb;
  openModal('confirm-modal');
}

function setLoading(btn, on) {
  if (!btn) return;
  if (on) btn.classList.add('btn-loading');
  else btn.classList.remove('btn-loading');
}

function dbPath(...parts) {
  return \`\${DB_BASE}/hubs/\${APP.hubId}/\${parts.join('/')}\`;
}

window.setLang = function(lang) {
  APP.lang = lang;
  localStorage.setItem('rp_lang', lang);
  const root = document.getElementById('root');
  root.lang = lang;
  root.dir = lang === 'ar' ? 'rtl' : 'ltr';
  ['lang-en','lang-ar'].forEach(id => {
    const b = $(id);
    if (b) b.classList.toggle('active', id === \`lang-\${lang}\`);
  });
  applyTranslations();
  if (APP.hubId) refreshCurrentView();
}

window.setAuthLang = function(lang) {
  APP.lang = lang;
  const root = document.getElementById('root');
  root.lang = lang; root.dir = lang === 'ar' ? 'rtl' : 'ltr';
  ['auth-lang-en','auth-lang-ar'].forEach(id => {
    const b = $(id);
    if (b) b.classList.toggle('active', id === \`auth-lang-\${lang}\`);
  });
  applyTranslations();
}

function applyTranslations() {
  $$('[data-t]').forEach(e => {
    const key = e.getAttribute('data-t');
    const v = T[APP.lang][key];
    if (v !== undefined) e.textContent = v;
  });
  $$('[data-t-placeholder]').forEach(e => {
    const key = e.getAttribute('data-t-placeholder');
    const v = T[APP.lang][key];
    if (v !== undefined) e.placeholder = v;
  });
}

let fbApp, db, auth;

async function initFirebase() {
  try {
    fbApp = initializeApp(FIREBASE_CONFIG);
    db = getFirestore(fbApp);
    auth = getAuth(fbApp);
    APP.db = db; APP.auth = auth;
    await signInAnonymously(auth);
  } catch(e) {
    console.error('Firebase init error:', e);
    showToast('Database connection error', 'error');
  }
}

function clearListeners() {
  APP.unsubs.forEach(u => u());
  APP.unsubs = [];
}

function setupHubListeners() {
  clearListeners();
  const base = \`\${DB_BASE}/hubs/\${APP.hubId}\`;

  const clientsUnsub = onSnapshot(collection(db, \`\${base}/clients\`), snap => {
    APP.clients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    APP.clients.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
    refreshCurrentView();
  });

  const quotesUnsub = onSnapshot(collection(db, \`\${base}/quotes\`), snap => {
    APP.quotes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    APP.quotes.sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
    refreshCurrentView();
  });

  const projectsUnsub = onSnapshot(collection(db, \`\${base}/projects\`), snap => {
    APP.projects = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    refreshCurrentView();
  });

  const txUnsub = onSnapshot(collection(db, \`\${base}/transactions\`), snap => {
    APP.transactions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    refreshCurrentView();
  });

  APP.unsubs = [clientsUnsub, quotesUnsub, projectsUnsub, txUnsub];
}

window.switchAuthTab = function(tab) {
  $('auth-form-new').style.display = tab === 'new' ? 'block' : 'none';
  $('auth-form-existing').style.display = tab === 'existing' ? 'block' : 'none';
  $('tab-new').classList.toggle('active', tab === 'new');
  $('tab-existing').classList.toggle('active', tab === 'existing');
  if (tab === 'new') $('new-hub-id').value = genHubId();
}

window.handleCreateHub = async function() {
  const id = $('new-hub-id').value.trim().toUpperCase();
  const pwd = $('new-hub-pwd').value;
  const pwd2 = $('new-hub-pwd2').value;
  if (!id || !pwd) return showToast('Hub ID and password required', 'error');
  if (pwd !== pwd2) return showToast(t('passwordMismatch'), 'error');
  const btn = $('create-hub-btn');
  setLoading(btn, true);
  try {
    const hash = await hashPwd(pwd);
    const hubDoc = doc(db, \`\${DB_BASE}/hubs/\${id}\`);
    const existing = await getDoc(hubDoc);
    if (existing.exists()) { setLoading(btn,false); return showToast('Hub ID taken','error'); }
    await setDoc(hubDoc, { passwordHash: hash, createdAt: serverTimestamp() });
    APP.hubId = id;
    localStorage.setItem('rp_hubId', id);
    sessionStorage.setItem('rp_auth', 'true');
    showToast(t('hubCreated'), 'success');
    enterApp();
  } catch(e) {
    console.error(e);
    showToast(t('error'), 'error');
  } finally { setLoading(btn, false); }
}

window.handleLoginHub = async function() {
  const id = $('existing-hub-id').value.trim().toUpperCase();
  const pwd = $('existing-hub-pwd').value;
  if (!id || !pwd) return showToast('Hub ID and password required', 'error');
  const btn = $('login-hub-btn');
  setLoading(btn, true);
  try {
    const hash = await hashPwd(pwd);
    const hubDoc = doc(db, \`\${DB_BASE}/hubs/\${id}\`);
    const snap = await getDoc(hubDoc);
    if (!snap.exists()) { setLoading(btn,false); return showToast(t('hubNotFound'), 'error'); }
    if (snap.data().passwordHash !== hash) { setLoading(btn,false); return showToast(t('wrongPassword'), 'error'); }
    APP.hubId = id;
    localStorage.setItem('rp_hubId', id);
    sessionStorage.setItem('rp_auth', 'true');
    showToast(t('loginSuccess'), 'success');
    enterApp();
  } catch(e) {
    console.error(e);
    showToast(t('error'), 'error');
  } finally { setLoading(btn, false); }
}

function enterApp() {
  $('auth-screen').style.display = 'none';
  $('app').style.display = 'flex';
  $('sidebar-hub-id').textContent = \`HUB: \${APP.hubId}\`;
  setupHubListeners();
  navigate('dashboard');
  applyTranslations();
}

window.handleLogout = function() {

  kpis.forEach(k => {

    val.style.color = k.color;
    val.textContent = k.value;
    const lbl = el('div', 'kpi-label text-muted', k.label);
    card.append(iconEl, val, lbl);
    kpiGrid.appendChild(card);
  });

  const qCard = el('div','card');
  const qHeader = el('div','');
  qHeader.style.cssText = 'padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;';
  const qTitle = el('h3', '', t('recentQuotes'));

  qBtn.onclick = () => navigate('quotes');
  qHeader.append(qTitle, qBtn);
  qCard.appendChild(qHeader);
  const qList = el('div','');
  const recQuotes = APP.quotes.slice(0,5);
  if (recQuotes.length === 0) {
    qList.appendChild(emptyState(t('noQuotes')));
  } else {
    recQuotes.forEach(q => {
      const client = APP.clients.find(c=>c.id===q.clientId);
      const item = el('div','list-item');
      item.style.cursor = 'pointer';
      item.onclick = () => { navigate('quotes'); setTimeout(()=>viewQuote(q.id),100); };
      const info = el('div','');
      info.style.flex = '1';
      const nm = el('div','', \`#\${q.number || q.id.substring(0,6)}\`);
      nm.style.cssText = 'font-size:13px;font-weight:600;';

      clientNm.style.fontSize = '12px';

      info.append(nm, clientNm, date);
      const total = el('div','');
      total.style.cssText = 'font-size:14px;font-weight:700;color:var(--green);';
      const subT = (q.items||[]).reduce((s,i)=>s+Number(i.quantity||0)*Number(i.unitPrice||0),0);
      const vat = subT * 0.15;
      total.textContent = formatMoney(subT+vat)+' SAR';
      item.append(info, total);
      qList.appendChild(item);
    });
  }
  qCard.appendChild(qList);

  wrap.append(kpiGrid, qCard);
  area.appendChild(wrap);

function openClientModal(client=null) {
  $('cm-id').value = client?.id||'';
  $('cm-name').value = client?.name||'';
  $('cm-company').value = client?.company||'';
  $('cm-email').value = client?.email||'';
  $('cm-phone').value = client?.phone||'';
  $('cm-notes').value = client?.notes||'';
  $('client-modal-title').textContent = client ? t('editClient') : t('addClient');
  openModal('client-modal');
}

function openQuoteModal(quote=null) {
  $('qm-id').value = quote?.id||'';
  $('qm-number').value = quote?.number||'';
  $('qm-date').value = quote?.date||new Date().toISOString().split('T')[0];
  const validDate = new Date();
  validDate.setDate(validDate.getDate() + 18);
  $('qm-valid').value = quote?.validUntil||validDate.toISOString().split('T')[0];
  $('qm-desc').value = quote?.description||'';
  $('qm-delivery').value = quote?.deliveryDays||25;
  $('qm-warranty').value = quote?.warrantyYears||3;
  $('qm-notes').value = quote?.specialNotes||'';
  
  const sel = $('qm-client');
  sel.innerHTML = '<option value="">— Select —</option>';
  APP.clients.forEach(c=>{const o=el('option','',c.name);o.value=c.id;if(c.id===quote?.clientId)o.selected=true;sel.appendChild(o);});
  
  APP.quoteItemCounter = 0;
  $('quote-items-container').innerHTML = '';
  if (quote && quote.items && quote.items.length > 0) {
    quote.items.forEach(item => addQuoteItem(item));
  } else {
    addQuoteItem();
  }
  
  $('quote-modal-title').textContent = quote ? t('editQuote') : t('newQuote');
  openModal('quote-modal');
}

window.addQuoteItem = function(item=null) {
  const container = $('quote-items-container');
  const id = ++APP.quoteItemCounter;
  
  const row = el('div','quote-item-row');
  row.dataset.itemId = id;
  
  const noInput = el('input','field-input');
  noInput.type = 'number';
  noInput.placeholder = '#';
  noInput.value = item?.no || id;
  noInput.dataset.field = 'no';
  
  const descTa = el('textarea','field-input');
  descTa.placeholder = t('description');
  descTa.value = item?.description || '';
  descTa.dataset.field = 'description';
  
  const qtyInput = el('input','field-input');
  qtyInput.type = 'number';
  qtyInput.placeholder = t('quantity');
  qtyInput.value = item?.quantity || 1;
  qtyInput.dataset.field = 'quantity';
  qtyInput.step = '0.01';
  
  const priceInput = el('input','field-input');
  priceInput.type = 'number';
  priceInput.placeholder = t('unitPrice');
  priceInput.value = item?.unitPrice || 0;
  priceInput.dataset.field = 'unitPrice';
  priceInput.step = '0.01';
  
  const totalInput = el('input','field-input');
  totalInput.readOnly = true;
  totalInput.placeholder = t('total');
  totalInput.style.background = 'var(--surface2)';
  totalInput.dataset.field = 'total';
  
  const calcTotal = () => {
    const qty = Number(qtyInput.value) || 0;
    const price = Number(priceInput.value) || 0;
    totalInput.value = formatMoney(qty * price);
  };
  
  qtyInput.oninput = calcTotal;
  priceInput.oninput = calcTotal;
  calcTotal();
  
  const delBtn = el('button','btn btn-xs btn-red','🗑');
  delBtn.onclick = () => { if(container.children.length > 1) container.removeChild(row); };
  
  row.append(noInput, descTa, qtyInput, priceInput, totalInput, delBtn);
  container.appendChild(row);
}

window.saveClient = async function() {
  const name = $('cm-name').value.trim();
  if(!name) return showToast('Name required','error');
  const btn = $('save-client-btn');
  setLoading(btn,true);
  try {
    const data = {
      name, company:$('cm-company').value.trim(), email:$('cm-email').value.trim(),
      phone:$('cm-phone').value.trim(), notes:$('cm-notes').value.trim(),
    };
    const id = $('cm-id').value;
    if(id) {
      await updateDoc(doc(db,\`\${DB_BASE}/hubs/\${APP.hubId}/clients\`,id), data);
    } else {
      data.createdAt=serverTimestamp();
      await addDoc(collection(db,\`\${DB_BASE}/hubs/\${APP.hubId}/clients\`), data);
    }
    closeModal('client-modal');
    showToast(t('clientSaved'),'success');
  } catch(e){console.error(e);showToast(t('error'),'error');}
  setLoading(btn,false);
}

async function deleteClient(id) {
  closeModal('confirm-modal');
  try {
    await deleteDoc(doc(db,\`\${DB_BASE}/hubs/\${APP.hubId}/clients\`,id));
    showToast(t('clientSaved'),'success');
  } catch(e){console.error(e);showToast(t('error'),'error');}
}

window.saveQuote = async function() {
  const clientId = $('qm-client').value;
  if(!clientId) return showToast('Client required','error');
  
  const itemRows = $$('#quote-items-container .quote-item-row');
  const items = Array.from(itemRows).map(row => ({
    no: Number(row.querySelector('[data-field="no"]').value) || 1,
    description: row.querySelector('[data-field="description"]').value.trim(),
    quantity: Number(row.querySelector('[data-field="quantity"]').value) || 1,
    unitPrice: Number(row.querySelector('[data-field="unitPrice"]').value) || 0,
  }));
  
  if (items.length === 0 || !items[0].description) return showToast('At least one item required','error');
  
  const btn = $('save-quote-btn');
  setLoading(btn,true);
  try {
    const data = {
      number: $('qm-number').value.trim(),
      clientId,
      date: $('qm-date').value,
      validUntil: $('qm-valid').value,
      description: $('qm-desc').value.trim(),
      items,
      deliveryDays: Number($('qm-delivery').value) || 25,
      warrantyYears: Number($('qm-warranty').value) || 3,
      specialNotes: $('qm-notes').value.trim(),
    };
    const id = $('qm-id').value;
    if(id) {
      await updateDoc(doc(db,\`\${DB_BASE}/hubs/\${APP.hubId}/quotes\`,id), data);
    } else {
      data.createdAt=serverTimestamp();
      await addDoc(collection(db,\`\${DB_BASE}/hubs/\${APP.hubId}/quotes\`), data);
    }
    closeModal('quote-modal');
    showToast(t('quoteSaved'),'success');
  } catch(e){console.error(e);showToast(t('error'),'error');}
  setLoading(btn,false);
}

async function deleteQuote(id) {
  closeModal('confirm-modal');
  try {
    await deleteDoc(doc(db,\`\${DB_BASE}/hubs/\${APP.hubId}/quotes\`,id));
    showToast(t('quoteDeleted'),'success');

}

function generateQuotePDF(quote) {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();
  const client = APP.clients.find(c=>c.id===quote.clientId);
  
  // LOGO / HEADER
  pdf.setFontSize(24);
  pdf.setFont('helvetica','bold');
  pdf.text('RP', 14, 20);
  pdf.setFontSize(10);
  pdf.setFont('helvetica','normal');
  pdf.text('RATTAN PALACE', 14, 26);
  
  // QUOTATION TITLE
  pdf.setFontSize(18);
  pdf.setFont('helvetica','bold');
  pdf.setTextColor(128, 0, 128);
  pdf.text(t('quotation'), 105, 20, { align: 'center' });
  
  // DATE BOX (top right)
  pdf.setFontSize(9);
  pdf.setTextColor(0);
  pdf.setFont('helvetica','normal');
  let yPos = 35;
  pdf.text(\`Date: \${formatDate(quote.date)}\`, 140, yPos);
  yPos += 5;
  pdf.text(\`Valid Until: \${formatDate(quote.validUntil)}\`, 140, yPos);
  yPos += 5;
  pdf.text(\`Quote #: \${quote.number || quote.id.substring(0,8)}\`, 140, yPos);
  yPos += 5;
  pdf.text(\`Customer ID: \${client?.id?.substring(0,6) || 'N/A'}\`, 140, yPos);
  
  // CUSTOMER INFO
  pdf.setFontSize(10);
  pdf.setFont('helvetica','bold');
  pdf.text(t('customer')+':', 14, 50);
  pdf.setFont('helvetica','normal');
  pdf.text(client?.name || '—', 14, 56);
  if (client?.company) pdf.text(client.company, 14, 61);
  
  // PROJECT DESCRIPTION
  pdf.setFont('helvetica','bold');
  pdf.text(t('quoteProjectDesc')+':', 100, 50);
  pdf.setFont('helvetica','normal');
  const descLines = pdf.splitTextToSize(quote.description || '', 90);
  pdf.text(descLines, 100, 56);
  
  // TABLE
  const tableData = quote.items.map(item => [
    item.no,
    item.description,
    item.quantity,
    formatMoney(item.unitPrice),
    formatMoney(item.quantity * item.unitPrice)
  ]);
  
  const subtotal = quote.items.reduce((s,i)=>s+Number(i.quantity||0)*Number(i.unitPrice||0),0);
  const vat = subtotal * 0.15;
  const total = subtotal + vat;
  
  pdf.autoTable({
    startY: 75,
    head: [[t('no'), t('description'), t('quantity'), t('unitPrice'), t('total')]],
    body: tableData,
    theme: 'grid',
    styles: { fontSize: 9, cellPadding: 3 },
    headStyles: { fillColor: [128, 0, 128], textColor: 255 },
    columnStyles: {
      0: { cellWidth: 15 },
      1: { cellWidth: 85 },
      2: { cellWidth: 20, halign: 'center' },
      3: { cellWidth: 30, halign: 'right' },
      4: { cellWidth: 35, halign: 'right' }
    }
  });
  
  const finalY = pdf.lastAutoTable.finalY + 5;
  
  // TOTALS
  pdf.setFont('helvetica','bold');
  pdf.text(t('subtotal'), 130, finalY);
  pdf.text(formatMoney(subtotal), 190, finalY, { align: 'right' });
  
  pdf.text(t('vat'), 130, finalY + 6);
  pdf.text(formatMoney(vat), 190, finalY + 6, { align: 'right' });
  
  pdf.setFontSize(11);
  pdf.text(t('totalAmount'), 130, finalY + 13);
  pdf.text(formatMoney(total), 190, finalY + 13, { align: 'right' });
  
  // SPECIAL NOTES
  pdf.setFontSize(10);
  pdf.setFont('helvetica','bold');
  pdf.text(t('specialNotesInstructions'), 14, finalY + 25);
  
  // INSTALLMENTS
  pdf.setFont('helvetica','bold');
  pdf.text(t('installments'), 14, finalY + 35);
  pdf.setFont('helvetica','normal');
  pdf.setFontSize(9);
  pdf.text(t('downPayment'), 14, finalY + 41);
  pdf.text(t('payment2nd'), 14, finalY + 46);
  pdf.text(formatMoney(total), 190, finalY + 50, { align: 'right' });
  
  pdf.text(t('deliveryTime', {days: quote.deliveryDays || 25}), 14, finalY + 56);
  pdf.text(t('warrantyText', {years: quote.warrantyYears || 3}), 14, finalY + 61);
  
  // BANK INFO
  pdf.setFont('helvetica','bold');
  pdf.text(t('bankName')+': Al Riyadh BANK', 14, finalY + 70);
  pdf.setFont('helvetica','normal');
  pdf.text(t('ibanDetails')+': SA3020000002126072249940', 14, finalY + 75);
  
  // FOOTER NOTE
  pdf.setFontSize(8);
  pdf.text(t('footerNote'), 14, finalY + 85);
  
  // SIGNATURE
  pdf.text(t('signature')+':', 14, finalY + 95);
  pdf.text(t('printName')+':', 70, finalY + 95);
  pdf.text(t('date')+':', 130, finalY + 95);
  
  pdf.line(14, finalY + 105, 60, finalY + 105);
  pdf.line(70, finalY + 105, 120, finalY + 105);
  pdf.line(130, finalY + 105, 180, finalY + 105);
  
  // COMPANY FOOTER
  pdf.setFontSize(7);
  pdf.text(t('thankYou'), 105, finalY + 115, { align: 'center' });
  pdf.text(t('rattanPalaceCR'), 105, finalY + 120, { align: 'center' });
  pdf.text(t('vatNo'), 105, finalY + 124, { align: 'center' });
  pdf.text(t('address'), 105, finalY + 128, { align: 'center' });
  
  pdf.save(\`Quote_\${quote.number || quote.id.substring(0,6)}.pdf\`);
}

  if(e.key==='Escape') {
    ['client-modal','quote-modal','confirm-modal','settings-modal'].forEach(id=>{
      closeModal(id);
    });
  }
});

window.toggleSidebar = function() {
  const sb=$('sidebar');
  sb.classList.toggle('open');
}

function checkMobile() {
  const mobileBtn=$('mobile-menu-btn');
  if(mobileBtn) mobileBtn.style.display=window.innerWidth<768?'flex':'none';
}
window.addEventListener('resize', checkMobile);

async function init() {
  APP.lang = localStorage.getItem('rp_lang') || (navigator.language.startsWith('ar')?'ar':'en');
  setLang(APP.lang);

  const savedKey=sessionStorage.getItem('rp_gemini');
  if(savedKey) APP.geminiKey=savedKey;

  if($('new-hub-id')) $('new-hub-id').value=genHubId();

  await initFirebase();

  const savedHubId=localStorage.getItem('rp_hubId');
  const sessionAuth=sessionStorage.getItem('rp_auth');

  if(savedHubId && sessionAuth==='true') {
    APP.hubId=savedHubId;
    enterApp();
  } else if(savedHubId) {
    switchAuthTab('existing');
    $('existing-hub-id').value=savedHubId;
  }

  checkMobile();
  applyTranslations();
}

window.closeModal = closeModal;
window.openModal = openModal;
window.navigate = navigate;
window.confirmAction = confirmAction;
window.saveSettings = function() {
  const key=$('settings-api-key-inline')?.value.trim()||$('settings-api-key')?.value.trim();
  if(key){ APP.geminiKey=key; sessionStorage.setItem('rp_gemini',key); showToast(t('apiKeySaved'),'success'); }
  closeModal('settings-modal');
}

init();
</script>
</body>
</html>
