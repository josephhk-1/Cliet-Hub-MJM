<!DOCTYPE html>
<html lang="en" dir="ltr" id="root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rattan Palace Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0e0a;--sidebar:#080602;--surface:#1a1610;--surface2:#221c12;--border:#3a2e1a;--gold:#c9960c;--gold2:#f0c040;--goldfaint:rgba(201,150,12,.10);--goldborder:rgba(201,150,12,.25);--text:#f0e6d2;--t2:#9a8a72;--t3:#5a5040;--green:#4d9e6a;--greenbg:rgba(77,158,106,.12);--red:#c45252;--redbg:rgba(196,82,82,.12);--blue:#4a7ab5;--bluebg:rgba(74,122,181,.12);--purple:#8b5cf6;--purplebg:rgba(139,92,246,.12);}
*,*::before,*::after{box-sizing:border-box;margin:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;overflow:hidden;}
[dir=rtl] *{font-family:"Tajawal",sans-serif;}
h1,h2,h3{font-family:"Cormorant Garamond",serif;font-weight:600;}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{font-family:"Tajawal",sans-serif;font-weight:700;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px;}
::-webkit-scrollbar-thumb:hover{background:var(--gold);}

/* LAYOUT */
#app{display:flex;height:100vh;}
#sidebar{width:240px;min-width:240px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:30;transition:transform .3s;}
#main{flex:1;overflow:hidden;display:flex;flex-direction:column;}
#view-area{flex:1;overflow-y:auto;}

/* SIDEBAR */
.s-logo{padding:24px 20px 18px;border-bottom:1px solid var(--border);text-align:center;}
.logo-big{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:700;color:var(--gold);}
.logo-small{font-size:9px;color:var(--t2);letter-spacing:.15em;text-transform:uppercase;margin-top:3px;}
.s-section{padding:14px 12px;}
.s-label{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.15em;padding:0 8px;margin-bottom:6px;}
.s-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--t2);font-size:13px;font-weight:500;transition:all .15s;margin-bottom:2px;border:1px solid transparent;user-select:none;}
.s-item:hover{background:var(--surface);color:var(--text);}
.s-item.active{background:var(--goldfaint);color:var(--gold);border-color:var(--goldborder);}
.s-item svg{width:15px;height:15px;flex-shrink:0;}
.s-bottom{margin-top:auto;padding:14px 12px;border-top:1px solid var(--border);}
.hub-badge{font-size:10px;color:var(--t3);padding:5px 8px;background:var(--surface);border-radius:6px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.lang-row{display:flex;gap:4px;margin-bottom:8px;}
.lang-btn{flex:1;padding:6px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--t2);transition:all .15s;font-family:inherit;}
.lang-btn.on{background:var(--gold);color:#000;border-color:var(--gold);}

/* TOPBAR */
#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 22px;display:flex;align-items:center;justify-content:space-between;}
.topbar-title{font-size:19px;color:var(--text);}
.topbar-actions{display:flex;gap:8px;align-items:center;}

/* AUTH */
#auth{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:420px;}
.auth-logo{text-align:center;margin-bottom:28px;}
.auth-tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:22px;}
.auth-tab{flex:1;padding:8px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:transparent;color:var(--t2);transition:all .15s;font-family:inherit;}
.auth-tab.on{background:var(--gold);color:#000;}

/* FORM */
.flabel{display:block;font-size:11px;color:var(--t2);margin-bottom:5px;letter-spacing:.04em;}
.finput{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 13px;font-size:13px;outline:none;transition:border-color .15s;font-family:inherit;}
.finput:focus{border-color:var(--gold);}
.finput::placeholder{color:var(--t3);}
select.finput option{background:var(--surface);}
textarea.finput{resize:vertical;min-height:70px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .15s;white-space:nowrap;font-family:inherit;}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px;}
.btn-xs{padding:4px 8px;font-size:11px;border-radius:5px;}
.btn-gold{background:var(--gold);color:#000;border-color:var(--gold);}
.btn-gold:hover{background:var(--gold2);border-color:var(--gold2);}
.btn-ghost{background:transparent;color:var(--t2);border-color:var(--border);}
.btn-ghost:hover{background:var(--surface2);color:var(--text);}
.btn-red{background:var(--redbg);color:var(--red);border-color:var(--red);}
.btn-red:hover{background:var(--red);color:#fff;}
.btn-purple{background:var(--purplebg);color:var(--purple);border-color:var(--purple);}
.btn-green{background:var(--greenbg);color:var(--green);border-color:var(--green);}
.btn:disabled{opacity:.5;pointer-events:none;}
.btn-loading{position:relative;color:transparent!important;pointer-events:none;}
.btn-loading::after{content:"";position:absolute;inset:0;margin:auto;width:15px;height:15px;border-radius:50%;border:2px solid #fff;border-top-color:transparent;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}

/* KPI */
.kpi{padding:18px;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;top:-16px;right:-16px;width:70px;height:70px;border-radius:50%;opacity:.08;}
.kpi-val{font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:700;line-height:1;}
.kpi-lbl{font-size:11px;color:var(--t2);margin-top:4px;}

/* TABLE */
.dtable{width:100%;border-collapse:collapse;font-size:13px;}
.dtable th{background:var(--surface2);color:var(--t2);font-weight:600;padding:9px 13px;text-align:left;font-size:10px;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border);}
[dir=rtl] .dtable th{text-align:right;}
.dtable td{padding:10px 13px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle;}
.dtable tr:last-child td{border-bottom:none;}
.dtable tr:hover td{background:var(--surface2);}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.mbox{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.mhead{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.mbody{padding:22px;}
.mfoot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
.mclose{background:none;border:none;cursor:pointer;color:var(--t2);font-size:20px;line-height:1;padding:2px;}

/* BADGE */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;}
.b-green{background:var(--greenbg);color:var(--green);}
.b-red{background:var(--redbg);color:var(--red);}
.b-blue{background:var(--bluebg);color:var(--blue);}
.b-gold{background:var(--goldfaint);color:var(--gold);}

/* LIST ITEM */
.litem{display:flex;align-items:center;gap:12px;padding:11px 15px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s;}
.litem:last-child{border-bottom:none;}
.litem:hover{background:var(--surface2);}

/* EMPTY */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center;gap:10px;}
.empty-icon{font-size:36px;opacity:.25;}
.empty-txt{font-size:13px;color:var(--t2);max-width:240px;}

/* TOAST */
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 18px;font-size:13px;color:var(--text);display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .3s ease;white-space:nowrap;}
.t-ok{border-left:3px solid var(--green);}
.t-err{border-left:3px solid var(--red);}
@keyframes tin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* QUOTE ITEMS */
.qi-row{display:grid;grid-template-columns:55px 1fr 70px 100px 110px 36px;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--border);}
.qi-row:last-child{border-bottom:none;}
.qi-row .finput{font-size:12px;padding:7px 9px;}
.qi-row textarea.finput{min-height:56px;}

/* UPLOAD */
#upload-prog{position:fixed;bottom:18px;right:18px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:13px 16px;z-index:300;min-width:220px;display:none;}
.progbar{background:var(--bg);border-radius:99px;height:5px;overflow:hidden;margin-top:8px;}
.progfill{height:100%;background:var(--gold);transition:width .3s;}

@media(max-width:768px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);}
  [dir=rtl] #sidebar{left:auto;right:0;transform:translateX(100%);}
  #sidebar.open{transform:translateX(0);}
}
</style>
</head>
<body>

<!-- ====== AUTH ====== -->
<div id="auth">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-big">&#10022; RATTAN PALACE</div>
      <div class="logo-small" style="color:var(--t2);margin-top:4px;">Professional Hub</div>
      <div style="display:flex;gap:4px;justify-content:center;margin-top:12px;">
        <button class="lang-btn on" id="alang-en" onclick="setAuthLang('en')">EN</button>
        <button class="lang-btn" id="alang-ar" onclick="setAuthLang('ar')">AR</button>
      </div>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab on" id="atab-new" onclick="switchTab('new')" id="tab-new">Create New Hub</button>
      <button class="auth-tab" id="atab-exist" onclick="switchTab('exist')">Join Existing Hub</button>
    </div>
    <div id="aform-new">
      <div style="margin-bottom:13px;"><label class="flabel">Hub ID (auto)</label><input id="a-new-id" class="finput" readonly style="opacity:.6;"></div>
      <div style="margin-bottom:13px;"><label class="flabel">Password</label><input id="a-new-pwd" class="finput" type="password" placeholder="Enter password"></div>
      <div style="margin-bottom:18px;"><label class="flabel">Confirm Password</label><input id="a-new-pwd2" class="finput" type="password" placeholder="Confirm password"></div>
      <button class="btn btn-gold" style="width:100%;" id="btn-create" onclick="doCreate()">Create Hub</button>
    </div>
    <div id="aform-exist" style="display:none;">
      <div style="margin-bottom:13px;"><label class="flabel">Hub ID</label><input id="a-ex-id" class="finput" placeholder="e.g. AB12CD34" style="text-transform:uppercase;"></div>
      <div style="margin-bottom:18px;"><label class="flabel">Password</label><input id="a-ex-pwd" class="finput" type="password" placeholder="Enter password"></div>
      <button class="btn btn-gold" style="width:100%;" id="btn-login" onclick="doLogin()">Login to Hub</button>
    </div>
  </div>
</div>

<!-- ====== APP ====== -->
<div id="app" style="display:none;">
  <nav id="sidebar">
    <div class="s-logo">
      <div class="logo-big">&#10022; RATTAN PALACE</div>
      <div class="logo-small">Hub Pro</div>
    </div>
    <div class="s-section">
      <div class="s-label">Menu</div>
      <div class="s-item active" data-m="dash" onclick="go('dash')">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span id="nav-dash">Dashboard</span>
      </div>
      <div class="s-item" data-m="clients" onclick="go('clients')">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        <span id="nav-clients">Clients</span>
      </div>
      <div class="s-item" data-m="quotes" onclick="go('quotes')">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span id="nav-quotes">Quotes / Devis</span>
      </div>
      <div class="s-item" data-m="finance" onclick="go('finance')">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8V7m0 1v8m0 0v1"/><circle cx="12" cy="12" r="9"/></svg>
        <span id="nav-finance">Finance</span>
      </div>
    </div>
    <div class="s-bottom">
      <div class="hub-badge">
        <span id="hub-id-show">HUB: ---</span>
        <button onclick="copyHub()" title="Copy" style="background:none;border:none;cursor:pointer;color:var(--t3);">
          <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        </button>
      </div>
      <div class="lang-row">
        <button class="lang-btn on" id="lang-en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" id="lang-ar" onclick="setLang('ar')">AR</button>
      </div>
      <div class="s-item" style="width:100%;" onclick="doLogout()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        <span id="nav-logout">Logout</span>
      </div>
    </div>
  </nav>

  <div id="main">
    <div id="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button id="menu-btn" style="display:none;background:none;border:none;cursor:pointer;color:var(--t2);" onclick="toggleSidebar()">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h2 class="topbar-title" id="page-title">Dashboard</h2>
      </div>
      <div class="topbar-actions" id="top-actions"></div>
    </div>
    <div id="view-area"></div>
  </div>
</div>

<!-- ====== MODALS ====== -->

<!-- CLIENT MODAL -->
<div class="overlay" id="m-client" style="display:none;">
  <div class="mbox" style="max-width:500px;">
    <div class="mhead"><h3 id="m-client-title">Add Client</h3><button class="mclose" onclick="closeM('m-client')">&#10005;</button></div>
    <div class="mbody">
      <input type="hidden" id="c-id">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
        <div><label class="flabel" id="lbl-name">Name *</label><input id="c-name" class="finput" placeholder="Full name"></div>
        <div><label class="flabel" id="lbl-company">Company</label><input id="c-company" class="finput" placeholder="Company"></div>
        <div><label class="flabel" id="lbl-email">Email</label><input id="c-email" class="finput" type="email" placeholder="email@..."></div>
        <div><label class="flabel" id="lbl-phone">Phone</label><input id="c-phone" class="finput" type="tel" placeholder="+966..."></div>
      </div>
      <div><label class="flabel" id="lbl-notes">Notes</label><textarea id="c-notes" class="finput" rows="3"></textarea></div>
    </div>
    <div class="mfoot">
      <button class="btn btn-ghost" onclick="closeM('m-client')" id="btn-cancel">Cancel</button>
      <button class="btn btn-gold" id="btn-save-client" onclick="saveClient()">Save</button>
    </div>
  </div>
</div>

<!-- QUOTE MODAL -->
<div class="overlay" id="m-quote" style="display:none;">
  <div class="mbox" style="max-width:860px;">
    <div class="mhead"><h3 id="m-quote-title">New Quote</h3><button class="mclose" onclick="closeM('m-quote')">&#10005;</button></div>
    <div class="mbody">
      <input type="hidden" id="q-id">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:14px;">
        <div><label class="flabel">Quote # *</label><input id="q-num" class="finput" placeholder="S962"></div>
        <div><label class="flabel" id="lbl-client">Client *</label><select id="q-client" class="finput"><option value="">-- Select --</option></select></div>
        <div><label class="flabel" id="lbl-date">Date</label><input id="q-date" class="finput" type="date"></div>
        <div><label class="flabel" id="lbl-valid">Valid Until</label><input id="q-valid" class="finput" type="date"></div>
      </div>
      <div style="margin-bottom:14px;"><label class="flabel" id="lbl-projdesc">Project Description</label><textarea id="q-desc" class="finput" rows="2" placeholder="e.g. Manufacturing and installation of a meeting room..."></textarea></div>
      
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <label class="flabel" style="margin:0;" id="lbl-items">Items</label>
        <button class="btn btn-xs btn-gold" onclick="addRow()">+ Add Item</button>
      </div>
      <!-- ITEMS HEADER -->
      <div style="display:grid;grid-template-columns:55px 1fr 70px 100px 110px 36px;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:4px;">
        <div style="font-size:10px;color:var(--t2);font-weight:700;">NO.</div>
        <div style="font-size:10px;color:var(--t2);font-weight:700;" id="lbl-desc">DESCRIPTION</div>
        <div style="font-size:10px;color:var(--t2);font-weight:700;text-align:center;" id="lbl-qty">QTY</div>
        <div style="font-size:10px;color:var(--t2);font-weight:700;text-align:right;" id="lbl-uprice">UNIT PRICE</div>
        <div style="font-size:10px;color:var(--t2);font-weight:700;text-align:right;" id="lbl-total">TOTAL</div>
        <div></div>
      </div>
      <div id="q-items"></div>
      
      <!-- TOTALS PREVIEW -->
      <div style="display:flex;justify-content:flex-end;margin-top:12px;">
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;min-width:220px;">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;"><span style="color:var(--t2);" id="lbl-subtotal">Subtotal</span><span id="prev-sub">0.00</span></div>
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;"><span style="color:var(--t2);">VAT 15%</span><span id="prev-vat">0.00</span></div>
          <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;border-top:1px solid var(--border);padding-top:6px;margin-top:6px;"><span style="color:var(--gold);" id="lbl-tot">TOTAL</span><span style="color:var(--gold);" id="prev-tot">0.00</span></div>
        </div>
      </div>
      
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;margin-bottom:12px;">
        <div><label class="flabel" id="lbl-delivery">Delivery (days)</label><input id="q-delivery" class="finput" type="number" value="25" min="1"></div>
        <div><label class="flabel" id="lbl-warranty">Warranty (years)</label><input id="q-warranty" class="finput" type="number" value="3" min="1"></div>
      </div>
      <div><label class="flabel" id="lbl-spnotes">Special Notes</label><textarea id="q-notes" class="finput" rows="2"></textarea></div>
    </div>
    <div class="mfoot">
      <button class="btn btn-ghost" onclick="closeM('m-quote')" id="btn-cancel2">Cancel</button>
      <button class="btn btn-gold" id="btn-save-quote" onclick="saveQuote()">Save Quote</button>
    </div>
  </div>
</div>

<!-- TXN MODAL -->
<div class="overlay" id="m-txn" style="display:none;">
  <div class="mbox" style="max-width:480px;">

function g(id) { return document.getElementById(id); }
function qs(sel) { return document.querySelector(sel); }
function qsa(sel) { return document.querySelectorAll(sel); }

function cel(tag, cls, txt) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}

function fmtMoney(n) {
  var num = Number(n) || 0;
  return num.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtDate(d) {
  if (!d) return "—";
  try {
    var dt = new Date(d);
    return dt.toLocaleDateString("en-US", { year:"numeric", month:"long", day:"numeric" });
  } catch(e) { return d; }
}

function initials(n) {
  if (!n) return "?";
  var w = n.trim().split(/\s+/);
  if (w.length > 1) return (w[0][0] + w[w.length-1][0]).toUpperCase();
  return n.substring(0,2).toUpperCase();
}

function toast(msg, type) {
  var c = g("toasts");
  var d = cel("div", "toast " + (type === "err" ? "t-err" : "t-ok"));
  var ic = cel("span", "", type === "err" ? "✕" : "✓");
  ic.style.fontWeight = "700";
  ic.style.color = type === "err" ? "var(--red)" : "var(--green)";
  d.appendChild(ic);
  d.appendChild(cel("span", "", msg));
  c.appendChild(d);
  setTimeout(function() { if (c.contains(d)) c.removeChild(d); }, 3500);
}

function openM(id) { var m = g(id); if (m) m.style.display = "flex"; }
function closeM(id) { var m = g(id); if (m) m.style.display = "none"; }

function confirm2(title, text, cb) {
  g("conf-title").textContent = title;
  g("conf-text").textContent = text;
  APP.confirmCb = cb;
  openM("m-confirm");
}

function setLoad(btn, on) {
  if (!btn) return;
  if (on) btn.classList.add("btn-loading");
  else btn.classList.remove("btn-loading");
}

async function sha256(str) {
  var enc = new TextEncoder().encode(str);
  var buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2,"0"); }).join("");
}

function genId() {
  return Math.random().toString(36).substring(2,6).toUpperCase() +
         Math.random().toString(36).substring(2,6).toUpperCase();
}

// FIREBASE DYNAMIC IMPORT
// ============================================================
var db = null;
var fs = null;
var FB_READY = false;

async function loadFirebase() {
  var m = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
  var mfs = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
  var ma = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
  var app = m.initializeApp(FB_CFG);
  db = mfs.getFirestore(app);
  APP.db = db;
  fs = mfs;
  var auth = ma.getAuth(app);
  try {
    await ma.signInAnonymously(auth);
  } catch(e) {
    console.warn("Auth warning (ok to ignore):", e.message);
  }
  FB_READY = true;
}

function hubCol(col) {
  return BASE + "/hubs/" + APP.hubId + "/" + col;
}

function stopListeners() {
  APP.unsubs.forEach(function(u) { try { u(); } catch(e){} });
  APP.unsubs = [];
}

function startListeners() {
  stopListeners();
  var u1 = fs.onSnapshot(fs.collection(db, hubCol("clients")), function(snap) {
    APP.clients = snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); });
    APP.clients.sort(function(a,b) { return (b.createdAt && b.createdAt.seconds || 0) - (a.createdAt && a.createdAt.seconds || 0); });
    rerender();
  });
  var u2 = fs.onSnapshot(fs.collection(db, hubCol("quotes")), function(snap) {
    APP.quotes = snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); });
    APP.quotes.sort(function(a,b) { return new Date(b.date||0) - new Date(a.date||0); });
    rerender();
  });
  var u3 = fs.onSnapshot(fs.collection(db, hubCol("transactions")), function(snap) {
    APP.txns = snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); });
    APP.txns.sort(function(a,b) { return new Date(b.date||0) - new Date(a.date||0); });
    rerender();
  });
  APP.unsubs = [u1, u2, u3];
}

function switchTab(tab) {
  g("aform-new").style.display = tab === "new" ? "block" : "none";
  g("aform-exist").style.display = tab === "exist" ? "block" : "none";
  g("atab-new").classList.toggle("on", tab === "new");
  g("atab-exist").classList.toggle("on", tab === "exist");
  if (tab === "new") g("a-new-id").value = genId();
}

async function doCreate() {
  if (!FB_READY) { toast("Connecting to database... please wait a moment and try again", "err"); return; }
  var id = (g("a-new-id").value || "").trim().toUpperCase();
  var pwd = g("a-new-pwd").value;
  var pwd2 = g("a-new-pwd2").value;
  if (!id || !pwd) return toast("Hub ID and password required", "err");
  if (pwd !== pwd2) return toast(t("pwdMismatch"), "err");
  var btn = g("btn-create"); setLoad(btn, true);
  try {
    var hash = await sha256(pwd);
    var ref = fs.doc(db, BASE + "/hubs/" + id);
    var snap = await fs.getDoc(ref);
    if (snap.exists()) { setLoad(btn, false); return toast("Hub ID already taken, try another", "err"); }
    await fs.setDoc(ref, { passwordHash: hash, createdAt: fs.serverTimestamp() });
    APP.hubId = id;
    localStorage.setItem("rp_hub", id);
    sessionStorage.setItem("rp_ok", "1");
    enterApp();
    toast(t("hubCreated"), "ok");
  } catch(e) { console.error(e); toast(t("error"), "err"); }
  setLoad(btn, false);
}

async function doLogin() {
  if (!FB_READY) { toast("Connecting to database... please wait a moment and try again", "err"); return; }
  var id = (g("a-ex-id").value || "").trim().toUpperCase();
  var pwd = g("a-ex-pwd").value;
  if (!id || !pwd) return toast("Hub ID and password required", "err");
  var btn = g("btn-login"); setLoad(btn, true);
  try {
    var hash = await sha256(pwd);
    var ref = fs.doc(db, BASE + "/hubs/" + id);
    var snap = await fs.getDoc(ref);
    if (!snap.exists()) { setLoad(btn, false); return toast(t("hubNotFound"), "err"); }
    if (snap.data().passwordHash !== hash) { setLoad(btn, false); return toast(t("wrongPwd"), "err"); }
    APP.hubId = id;
    localStorage.setItem("rp_hub", id);
    sessionStorage.setItem("rp_ok", "1");
    enterApp();
    toast(t("loginOk"), "ok");
  } catch(e) { console.error(e); toast(t("error"), "err"); }
  setLoad(btn, false);
}

function enterApp() {
  g("auth").style.display = "none";
  g("app").style.display = "flex";
  g("hub-id-show").textContent = "HUB: " + APP.hubId;
  startListeners();
  go("dash");
  applyLang();
}

function doLogout() {
  confirm2("Logout?", "You will need your Hub ID and password to log back in.", function() {
    stopListeners();
    sessionStorage.removeItem("rp_ok");
    APP.hubId = null; APP.clients = []; APP.quotes = []; APP.txns = [];
    g("app").style.display = "none";
    g("auth").style.display = "flex";
    closeM("m-confirm");
  });
}

function copyHub() {
  navigator.clipboard.writeText(APP.hubId).then(function() { toast(t("copied"), "ok"); });

  APP.page = page;

  var titles = { dash: t("dash"), clients: t("clients"), quotes: t("quotes"), finance: t("finance") };
  g("page-title").textContent = titles[page] || page;
  render(page);

  switch(page) {
    case "dash":    renderDash();    break;
    case "clients": renderClients(); break;
    case "quotes":  renderQuotes();  break;
    case "finance": renderFinance(); break;
  }
}

  area.innerHTML = "";

  var wrap = cel("div",""); wrap.style.padding = "22px";

  var kg = cel("div","");
  kg.style.cssText = "display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;";

function today() {
  return new Date().toISOString().split("T")[0];
}

function addDays(n) {
  var d = new Date(); d.setDate(d.getDate() + n);
  return d.toISOString().split("T")[0];
}

function addRow(item) {
  APP.rowCount++;
  var id = APP.rowCount;
  var container = g("q-items");
  var row = cel("div","qi-row"); row.dataset.rid = id;

  var noIn = cel("input","finput"); noIn.type = "number"; noIn.value = item ? item.no||id : id; noIn.placeholder = "#"; noIn.dataset.f = "no";
  var descTa = cel("textarea","finput"); descTa.value = item ? item.desc||"" : ""; descTa.placeholder = "Description..."; descTa.dataset.f = "desc";
  var qIn = cel("input","finput"); qIn.type = "number"; qIn.value = item ? item.qty||1 : 1; qIn.min = "0"; qIn.step = "0.01"; qIn.dataset.f = "qty";
  var pIn = cel("input","finput"); pIn.type = "number"; pIn.value = item ? item.price||0 : 0; pIn.min = "0"; pIn.step = "0.01"; pIn.dataset.f = "price";
  var totIn = cel("input","finput"); totIn.readOnly = true; totIn.style.background = "var(--surface2)"; totIn.dataset.f = "total";

  function calcRow() {
    var q2 = Number(qIn.value)||0; var p2 = Number(pIn.value)||0;
    totIn.value = fmtMoney(q2 * p2);
    updateTotals();
  }
  qIn.oninput = calcRow; pIn.oninput = calcRow;

  var delBtn = cel("button","btn btn-xs btn-red","🗑");
  delBtn.onclick = function() {
    if (container.children.length > 1) { container.removeChild(row); updateTotals(); }
  };

  calcRow();
  row.append(noIn, descTa, qIn, pIn, totIn, delBtn);
  container.appendChild(row);
}

function updateTotals() {
  var rows = qsa("#q-items .qi-row");
  var sub = 0;
  rows.forEach(function(row) {
    var q2 = Number((row.querySelector("[data-f=qty]")||{}).value)||0;
    var p2 = Number((row.querySelector("[data-f=price]")||{}).value)||0;
    sub += q2 * p2;
  });
  var vat = sub * 0.15;
  var tot = sub + vat;
  if (g("prev-sub")) g("prev-sub").textContent = fmtMoney(sub);
  if (g("prev-vat")) g("prev-vat").textContent = fmtMoney(vat);
  if (g("prev-tot")) g("prev-tot").textContent = fmtMoney(tot);
}

// ============================================================
// PDF GENERATION — EXACT RATTAN PALACE FORMAT
// ============================================================
function genPDF(q) {
  var jsPDF = window.jspdf.jsPDF;
  var pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
  var cl = APP.clients.find(function(c) { return c.id === q.clientId; }) || {};

  // Calculate totals
  var sub = (q.items||[]).reduce(function(s,i) { return s + Number(i.qty||0)*Number(i.price||0); }, 0);
  var vat = sub * 0.15;
  var tot = sub + vat;

  var W = 210; // A4 width mm
  var L = 14;  // left margin
  var R = W - 14; // right edge

  // ---- HEADER BACKGROUND ----
  pdf.setFillColor(240, 235, 250);
  pdf.rect(0, 0, W, 42, "F");

  // ---- LOGO (RP text style) ----
  pdf.setFont("helvetica","bold");
  pdf.setFontSize(28);
  pdf.setTextColor(80, 0, 100);
  pdf.text("RP", L, 16);
  pdf.setFontSize(9);
  pdf.setFont("helvetica","bold");
  pdf.text("RATTAN PALACE", L, 22);

  // ---- QUOTATION TITLE ----
  pdf.setFontSize(22);
  pdf.setFont("helvetica","bold");
  pdf.setTextColor(100, 30, 130);
  pdf.text("Quotation", W/2, 20, { align:"center" });

  // ---- DATE BOX (top right) ----
  pdf.setFontSize(9);
  pdf.setFont("helvetica","normal");
  pdf.setTextColor(50,50,50);
  var bx = 130, by = 10, bw = 65, bh = 28;
  pdf.setDrawColor(180,180,180);
  pdf.rect(bx, by, bw, bh);
  // border header
  pdf.setFillColor(80, 0, 100);
  pdf.rect(bx, by, bw, 5, "F");
  pdf.setTextColor(255,255,255); pdf.setFontSize(7.5); pdf.setFont("helvetica","bold");
  var headers2 = ["Date:", "Valid Until:", "Quote #:", "Customer ID:"];
  var vals = [
    fmtDate(q.date),
    fmtDate(q.validUntil),
    "#" + (q.number||q.id.substring(0,6)),
    "GA" + (cl.id||"000").substring(0,3).toUpperCase()
  ];
  headers2.forEach(function(h, i) {
    pdf.setTextColor(50,50,50); pdf.setFont("helvetica","normal"); pdf.setFontSize(8);
    pdf.text(h, bx+2, by+9+(i*5.5));
    pdf.setFont("helvetica","bold");
    pdf.text(vals[i], bx+bw-2, by+9+(i*5.5), { align:"right" });
  });

  // ---- HORIZONTAL SEPARATOR ----
  pdf.setDrawColor(200,200,200);
  pdf.line(L, 44, R, 44);

  // ---- CUSTOMER + PROJECT DESCRIPTION BOXES ----
  // Customer box (left)
  pdf.setFillColor(80,0,100);
  pdf.rect(L, 46, 85, 6, "F");
  pdf.setTextColor(255,255,255); pdf.setFont("helvetica","bold"); pdf.setFontSize(9);
  pdf.text("Customer:", L+2, 50.5);

  pdf.setTextColor(30,30,30); pdf.setFont("helvetica","bold"); pdf.setFontSize(10);
  pdf.text(cl.name || "—", L+2, 58);
  pdf.setFont("helvetica","normal"); pdf.setFontSize(9);
  if (cl.company) pdf.text(cl.company, L+2, 63);

  // Project Description box (right)
  pdf.setFillColor(80,0,100);
  pdf.rect(105, 46, 90, 6, "F");
  pdf.setTextColor(255,255,255); pdf.setFont("helvetica","bold"); pdf.setFontSize(9);
  pdf.text("Quote/Project Description", 107, 50.5);

  pdf.setTextColor(30,30,30); pdf.setFont("helvetica","normal"); pdf.setFontSize(9);
  var descLines = pdf.splitTextToSize(q.description||"", 86);
  pdf.text(descLines, 107, 58);

  // ---- ITEMS TABLE ----
  var tableData = (q.items||[]).map(function(item) {
    return [
      item.no || "",
      item.desc || "",
      String(item.qty || 0),
      "( " + fmtMoney(item.price) + ")",
      "( " + fmtMoney(Number(item.qty||0)*Number(item.price||0)) + ")"
    ];
  });

  pdf.autoTable({
    startY: 72,
    head: [["No.", "Description", "Quantity", "Unit price", "Total"]],
    body: tableData,
    theme: "grid",
    styles: { fontSize: 9, cellPadding: 3, textColor: [30,30,30] },
    headStyles: { fillColor: [80,0,100], textColor: [255,255,255], fontStyle:"bold", fontSize:9 },
    columnStyles: {
      0: { cellWidth: 14, halign:"center" },
      1: { cellWidth: 100 },
      2: { cellWidth: 20, halign:"center" },
      3: { cellWidth: 28, halign:"right" },
      4: { cellWidth: 28, halign:"right" }
    },
    didParseCell: function(data) {
      if (data.column.index === 4 && data.section === "body") {
        data.cell.styles.fontStyle = "bold";
      }
    }
  });

  var fy = pdf.lastAutoTable.finalY;

  // ---- SPECIAL NOTES + TOTALS side by side ----
  var notesY = fy + 4;

  // Left: Special Notes box
  pdf.setFillColor(80,0,100);
  pdf.rect(L, notesY, 100, 6, "F");
  pdf.setTextColor(255,255,255); pdf.setFont("helvetica","bold"); pdf.setFontSize(9);
  pdf.text("Special Notes and Instructions", L+2, notesY+4.5);

  // Right: Subtotal box
  pdf.setFillColor(248,248,248);
  pdf.setDrawColor(200,200,200);
  pdf.rect(118, notesY, 77, 20, "FD");
  pdf.setTextColor(30,30,30); pdf.setFont("helvetica","normal"); pdf.setFontSize(9);
  pdf.text("Subtotal", 120, notesY+7);
  pdf.setFont("helvetica","bold");
  pdf.text("( " + fmtMoney(sub) + ")", R, notesY+7, { align:"right" });
  pdf.setFont("helvetica","normal");
  pdf.text("vat", 120, notesY+13);
  pdf.setFont("helvetica","bold");
  pdf.text("( " + fmtMoney(vat) + ")", R, notesY+13, { align:"right" });
  pdf.setFont("helvetica","bold"); pdf.setFontSize(10);
  pdf.text("TOTAL", 120, notesY+20);
  pdf.text("( " + fmtMoney(tot) + ")", R, notesY+20, { align:"right" });

  // ---- INSTALLMENTS ----
  var instY = notesY + 24;
  pdf.setFillColor(248,248,248);
  pdf.setDrawColor(200,200,200);
  pdf.rect(L, instY, 100, 32, "FD");
  pdf.setTextColor(30,30,30); pdf.setFont("helvetica","bold"); pdf.setFontSize(9);
  pdf.text("Installments", L+2, instY+7);
  pdf.setFont("helvetica","bold"); pdf.setFontSize(9);
  pdf.text("Down payment 50%", L+2, instY+14);
  pdf.text("2nd payment 50% at time of delivery", L+2, instY+20);
  pdf.setFont("helvetica","normal");
  pdf.text(t("deliveryText",{d:q.deliveryDays||25}), L+2, instY+26);
  pdf.text(t("warrantyText",{y:q.warrantyYears||3}), L+2, instY+31);

  // Total box (right side of installments)
  pdf.setFillColor(80,0,100);
  pdf.rect(118, instY, 77, 32, "F");
  pdf.setTextColor(255,255,255); pdf.setFont("helvetica","normal"); pdf.setFontSize(9);
  pdf.text("Total", 120, instY+15);
  pdf.setFont("helvetica","bold"); pdf.setFontSize(14);
  pdf.text(fmtMoney(tot), R, instY+22, { align:"right" });

  // ---- BANK INFO ----
  var bankY = instY + 36;
  pdf.setTextColor(30,30,30); pdf.setFont("helvetica","bold"); pdf.setFontSize(9);
  pdf.text("Bank Name : Al Riyadh BANK", L, bankY);
  pdf.setFont("helvetica","bold");
  pdf.text("IBAN DETAILS: SA3020000002126072249940", L, bankY+6);

  // ---- FOOTER NOTE ----
  pdf.setFont("helvetica","normal"); pdf.setFontSize(7.5); pdf.setTextColor(80,80,80);
  pdf.text(t("footerNote"), L, bankY+14);
  pdf.text(t("payNote"), L, bankY+19);

  // ---- SIGNATURE LINE ----
  var sigY = bankY + 28;
  pdf.setFont("helvetica","normal"); pdf.setFontSize(8.5); pdf.setTextColor(30,30,30);
  pdf.text("Please confirm your acceptance of this quote by signing this document", L, sigY);

  // Three signature boxes
  var sx = [L, 80, 145];
  var slbls = [t("sig"), t("pname"), t("dateLabel")];
  sx.forEach(function(x2, i) {
    pdf.setFont("helvetica","normal"); pdf.setFontSize(8);
    pdf.text(slbls[i], x2, sigY+8);
    pdf.setDrawColor(100,100,100);
    pdf.line(x2, sigY+16, x2+52, sigY+16);
  });

  // ---- THANK YOU ----
  var tyY = sigY + 22;
  pdf.setFont("helvetica","bold"); pdf.setFontSize(11);
  pdf.setTextColor(100, 30, 130);
  pdf.text("Thank you for your business!", W/2, tyY, { align:"center" });

  // ---- COMPANY FOOTER ----
  var cfY = tyY + 8;
  pdf.setFillColor(80,0,100);
  pdf.rect(0, cfY, W, 14, "F");
  pdf.setTextColor(255,255,255); pdf.setFont("helvetica","bold"); pdf.setFontSize(8);
  pdf.text("Rattan Palace", W/2, cfY+4, { align:"center" });
  pdf.setFont("helvetica","normal"); pdf.setFontSize(7.5);
  pdf.text("CR: 7050562888     Vat No. : 313099850500003", W/2, cfY+8.5, { align:"center" });
  pdf.text("Short Address: RFKB2501. ALQods st,Alkhaleej, P.O.Box: 2401 RIYADH 13223, Kingdom of Saudi Arabia", W/2, cfY+13, { align:"center" });

  pdf.save("Rattan_Palace_Quote_" + (q.number||q.id.substring(0,6)) + ".pdf");
}

// ============================================================
// HELPERS
// ============================================================
function mkEmpty(txt) {
  var w = cel("div","empty");
  var ic = cel("div","empty-icon"); ic.textContent = "📭";
  var t2 = cel("div","empty-txt"); t2.textContent = txt;
  w.append(ic, t2); return w;
}

function toggleSidebar() {
  g("sidebar").classList.toggle("open");
}

// ============================================================
// INIT
// ============================================================
document.addEventListener("click", function(e) {
  if (e.target && e.target.id === "conf-ok") {
    if (APP.confirmCb) APP.confirmCb();
  }
});

document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    ["m-client","m-quote","m-txn","m-confirm"].forEach(function(id) { closeM(id); });
  }
});

window.addEventListener("resize", function() {
  var mb = g("menu-btn");
  if (mb) mb.style.display = window.innerWidth < 768 ? "flex" : "none";
});

async function init() {
  APP.lang = localStorage.getItem("rp_lang") || (navigator.language.startsWith("ar") ? "ar" : "en");
  setLang(APP.lang);

  if (g("a-new-id")) g("a-new-id").value = genId();

  // Show connecting state on buttons
  var bCreate = g("btn-create"); var bLogin = g("btn-login");
  function setBtnState(connecting) {
    if (bCreate) { bCreate.disabled = connecting; bCreate.style.opacity = connecting ? "0.6" : "1"; }
    if (bLogin) { bLogin.disabled = connecting; bLogin.style.opacity = connecting ? "0.6" : "1"; }
  }
  setBtnState(true);
  try {
    await loadFirebase();
    setBtnState(false);
    console.log("Firebase ready!");
  } catch(e) {
    console.error("Firebase error:", e);
    toast("Database connection failed. Check internet connection.", "err");
    setBtnState(false);
    return;
  }

  var savedHub = localStorage.getItem("rp_hub");
  var sessionOk = sessionStorage.getItem("rp_ok");

  if (savedHub && sessionOk === "1") {
    APP.hubId = savedHub;
    enterApp();
  } else if (savedHub) {
    switchTab("exist");
    g("a-ex-id").value = savedHub;
  }

  // check mobile
  if (window.innerWidth < 768) {
    var mb = g("menu-btn"); if (mb) mb.style.display = "flex";
  }
}

// Make functions global
window.switchTab = switchTab;
window.doCreate = doCreate;
window.doLogin = doLogin;
window.doLogout = doLogout;
window.setLang = setLang;
window.setAuthLang = setAuthLang;
window.go = go;
window.copyHub = copyHub;
window.closeM = closeM;
window.openM = openM;
window.saveClient = saveClient;
window.openClientModal = openClientModal;
window.saveQuote = saveQuote;
window.openQuoteModal = openQuoteModal;
window.addRow = addRow;
window.updateTotals = updateTotals;
window.saveTxn = saveTxn;
window.openTxnModal = openTxnModal;
window.setTxType = setTxType;
window.toggleSidebar = toggleSidebar;
window.genPDF = genPDF;

init();
</script>
